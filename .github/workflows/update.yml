name: Update Discord Waifu Widget

on:
  # automatic scheduled runs
  schedule:
    - cron: "0 */6 * * *"

  # manual reroll button
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-waifu-widget
  cancel-in-progress: false

jobs:
  update-widget:
    runs-on: ubuntu-latest

    steps:
      # =====================
      # CHECKOUT REPO
      # =====================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================
      # NODE SETUP
      # =====================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =====================
      # CACHE NODE MODULES
      # =====================
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # =====================
      # INSTALL DEPENDENCIES
      # =====================
      - name: Install dependencies
        run: npm install axios

      # =====================
      # RUN UPDATE SCRIPT
      # =====================
      - name: Run update.js
        env:
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

          # IMPORTANT
          # tells update.js if manual or scheduled
          GITHUB_EVENT_NAME: ${{ github.event_name }}

        run: node update.js

      # =====================
      # COMMIT MEMORY FILE
      # =====================
      - name: Commit last_character.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add last_character.json

          git diff --staged --quiet || git commit -m "Update character memory"

          git push

      # =====================
      # SUCCESS LOG
      # =====================
      - name: Done
        run: echo "Discord widget updated successfully"
