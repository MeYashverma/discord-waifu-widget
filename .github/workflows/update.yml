name: Update Discord Waifu Widget

on:
  workflow_dispatch:
  schedule:
    # Rotate automatically every 6 hours.
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: discord-waifu-widget
  cancel-in-progress: false

jobs:
  update-widget:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate script syntax
        run: npm run check

      - name: Update Discord widget
        env:
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          WIDGET_USERNAME: ${{ vars.WIDGET_USERNAME || 'waifu-widget' }}
          CHARACTER_SOURCE: ${{ vars.CHARACTER_SOURCE || 'auto' }}
          MIN_SOURCE_PAGE: ${{ vars.MIN_SOURCE_PAGE || '1' }}
          MAX_SOURCE_PAGE: ${{ vars.MAX_SOURCE_PAGE || '40' }}
          MAX_PICK_ATTEMPTS: ${{ vars.MAX_PICK_ATTEMPTS || '8' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: npm start

      - name: Commit character memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last_character.json
          git diff --staged --quiet && echo "No memory changes to commit." && exit 0

          git commit -m "Update character memory"
          git pull --rebase origin main
          git push origin main
