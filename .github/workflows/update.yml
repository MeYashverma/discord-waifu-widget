name: Update Discord Waifu Widget

on:
  workflow_dispatch:
  schedule:
    # Rotate automatically every 6 hours.
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: discord-waifu-widget
  cancel-in-progress: false

jobs:
  update-widget:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate script syntax
        run: npm run check

      - name: Update Discord widget
        env:
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_IMAGE_WEBHOOK_URL: ${{ secrets.DISCORD_IMAGE_WEBHOOK_URL }}
          DISCORD_TARGET_CHANNEL_ID: ${{ secrets.DISCORD_TARGET_CHANNEL_ID }}
          REMOVE_BG_API_KEY: ${{ secrets.REMOVE_BG_API_KEY }}
          WIDGET_USERNAME: ${{ vars.WIDGET_USERNAME || 'waifu-widget' }}
          DISABLE_IMAGE_FALLBACK: ${{ vars.DISABLE_IMAGE_FALLBACK || 'false' }}
          DISABLE_IMAGE_FIX: ${{ vars.DISABLE_IMAGE_FIX || 'false' }}
          DISABLE_REMOVE_BG: ${{ vars.DISABLE_REMOVE_BG || 'false' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: npm start

      - name: Commit character memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp last_character.json /tmp/last_character.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/last_character.json last_character.json

          git add last_character.json
          git diff --staged --quiet && echo "No memory changes to commit." && exit 0

          git commit -m "Update character memory"
          git push origin HEAD:main
